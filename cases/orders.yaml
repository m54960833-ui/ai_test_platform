# 订单接口测试用例：创建 -> 查询 -> 支付 -> 状态流转约束
- name: 订单-创建订单
  method: POST
  url: /api/orders
  body:
    user_id: 1
    product_id: 1001
    product_name: "测试商品"
    quantity: 2
    amount: 99.5
  validate:
    - type: status_code
      value: 200
    - type: jsonpath
      path: "$.data.status"
      value: "pending"
  save:
    - {key: oid, from: data.order_id}

- name: 订单-查询创建的订单
  method: GET
  url: /api/orders/@{oid}
  validate:
    - type: status_code
      value: 200
    - type: jsonpath
      path: "$.data.status"
      value: "pending"

- name: 订单-支付订单
  method: PUT
  url: /api/orders/@{oid}/status
  body:
    status: "paid"
  validate:
    - type: status_code
      value: 200
    - type: jsonpath
      path: "$.data.status"
      value: "paid"

- name: 订单-已支付不可再改状态
  method: PUT
  url: /api/orders/@{oid}/status
  body:
    status: "cancelled"
  validate:
    - type: status_code
      value: 200
    - type: jsonpath
      path: "$.code"
      value: 1004

- name: 订单-创建时用户不存在(404)
  method: POST
  url: /api/orders
  body:
    user_id: 999999
    product_id: 1
    quantity: 1
    amount: 10.0
  validate:
    - type: status_code
      value: 404

- name: 订单-数量小于1(422)
  method: POST
  url: /api/orders
  body:
    user_id: 1
    product_id: 1
    quantity: 0
    amount: 10.0
  validate:
    - type: status_code
      value: 422

- name: 订单-金额小于等于0(422)
  method: POST
  url: /api/orders
  body:
    user_id: 1
    product_id: 1
    quantity: 1
    amount: -5
  validate:
    - type: status_code
      value: 422

- name: 订单-查询不存在的订单(404)
  method: GET
  url: /api/orders/999999
  validate:
    - type: status_code
      value: 404

- name: 订单-按用户过滤列表
  method: GET
  url: /api/orders?user_id=1&page=1&page_size=10
  validate:
    - type: status_code
      value: 200
    - type: jsonpath
      path: "$.data.total"
      value: "@nonempty"
